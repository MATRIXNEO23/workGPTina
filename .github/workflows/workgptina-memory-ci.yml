name: workGPTina Memory CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python rag/repo_guard.py MATRIXNEO23/workGPTina
      - run: python rag/work_memory.py verify
      - run: python rag/work_memory.py build
      - run: python rag/work_memory.py test-gold
      - run: python -m unittest discover -s tests -v
      - run: test -z "$(git status --porcelain)"

